[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "hatch-vcs" ]

[project]
name = "tap-pokemon"
dynamic = [ "version" ]
description = "Singer tap for Pokemon, built with the Meltano SDK for Singer Taps."
readme = "README.md"
keywords = [
  "ELT",
  "Pokemon",
  "singer.io",
]
license = "Apache-2.0"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "requests-cache~=1.3.0",
  "singer-sdk~=0.55.0a1",
]
[[project.authors]]
name = "Edgar Ramírez-Mondragón"
email = "edgarrm358@gmail.com"
[project.urls]
Documentation = "https://github.com/reservoir-data/tap-pokemon#readme"
Homepage = "https://github.com/reservoir-data/tap-pokemon"
Repository = "https://github.com/reservoir-data/tap-pokemon"
[project.scripts]
tap-pokemon = "tap_pokemon.tap:TapPokemon.cli"

[dependency-groups]
dev = [
  { include-group = "testing" },
  { include-group = "typing" },
]
testing = [ "pytest~=9.0" ]
typing = [
  "mypy>=2.3.1",
  "ty>=0.0.80",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0dev0"

[tool.ruff]
required-version = ">=0.16"
line-length = 120
preview = true
[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "missing-trailing-comma",
  "single-line-implicit-string-concatenation",
]
per-file-ignores."noxfile.py" = [ "ANN" ]
per-file-ignores."tests/*" = [ "ANN" ]
flake8-annotations.allow-star-arg-any = true
isort.known-first-party = [ "tap_neon" ]
isort.required-imports = [ "from __future__ import annotations" ]
pydocstyle.convention = "google"

[tool.pyproject-fmt]
table_format = "long"

[tool.mypy]
warn_unreachable = true
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool" ]
strict = true
warn_unused_configs = true

[tool.pytest]
addopts = [
  "-v",
  "-ra",
]
filterwarnings = [
  "error",
  "once:No records were available to test:UserWarning",
  "once:Fields in transformed catalog but not in records:UserWarning",
]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = [ "tests" ]
